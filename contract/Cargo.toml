[package]
name = "clavis-contract"
version = "0.1.0"
edition = "2021"
authors = ["Arinze"]
description = "Rule-bound private payroll authorization contract for NEAR"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "1.5.7"
near-sdk = { version = "=5.17.2", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
