[package]
name = "clavis-factory"
version = "0.3.0"
edition = "2021"
authors = ["Arinze"]
description = "Factory for isolated Clavis payroll contracts on NEAR testnet"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "../src/factory.rs"

[dependencies]
borsh = "1.5.7"
near-sdk = { version = "=5.17.2", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy", "unit-testing"] }
