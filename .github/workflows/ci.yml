name: CI

on:
  push:
    branches: [main, feat/clavis-mvp]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Typecheck and test TypeScript
        run: |
          npm run typecheck
          npm run test:agent
      - name: Build frontend and agent
        run: npm run build
      - name: Test and build contract
        run: |
          cargo fmt --manifest-path contract/Cargo.toml --all -- --check
          cargo test --manifest-path contract/Cargo.toml
          bash scripts/build-contracts.sh
          cargo test --manifest-path contract/Cargo.toml --package clavis-factory
