[package]
name = "clavis-near-signer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
borsh = { version = "1.5.7", features = ["derive"] }
keyring = { version = "3.0.5", features = ["sync-secret-service", "vendored"] }
near-account-id = "3.0.0"
near-crypto = "0.38.0"
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
